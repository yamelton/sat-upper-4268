name: Verify proof and paper
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned mathlib cache
        run: sh lean/run.sh exe cache get
      - name: Build and audit all theorems; run independent checks
        run: python scripts/check.py
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-recommended texlive-latex-extra lmodern
      - name: Build and package paper
        run: |
          python scripts/build_paper.py
          python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: checked-publication
          path: |
            dist/
            results/lean_verification.json
            results/release-checks.json
            results/paper-checks.json
